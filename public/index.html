<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eleven Store</title>
<meta name="theme-color" content="#07101f">
<link rel="stylesheet" href="/store.css">
</head>
<body>
<header class="site-header">
  <div class="header-shell">
    <a class="brand" href="/"><img src="/assets/eleven-logo.png" alt="Eleven Store"><span>ELEVEN STORE</span></a>
    <nav class="nav-main">
      <a href="/" class="active" data-filter="all">الرئيسية</a>
      <a href="#products" data-filter="files">الملفات</a>
      <a href="#products" data-filter="scripts">السكربتات</a>
      <a href="#products" data-filter="all">جميع المنتجات</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button" id="accountButton" aria-label="Account">👤</button>
      <button class="icon-button cart-button" id="cartButton" aria-label="Cart">🛍<b id="cartBadge">0</b></button>
      <button class="icon-button" id="searchButton" aria-label="Search">⌕</button>
    </div>
  </div>
</header>

<div id="searchBar" class="search-bar hidden">
  <div class="search-inner"><input id="searchInput" placeholder="ابحث عن منتج..."><button id="closeSearch">×</button></div>
</div>

<main class="store-main">
  <section class="section-head">
    <div><span class="small-label">ELEVEN STORE</span><h1>أحدث المنتجات</h1></div>
    <div class="head-tools"><select id="sortSelect"><option value="newest">الأحدث</option><option value="price-low">السعر: الأقل</option><option value="price-high">السعر: الأعلى</option></select></div>
  </section>
  <section id="products" class="product-grid"></section>
</main>

<aside class="floating-tools">
  <div class="lang-wrap">
    <button id="langBtn" class="float-pill"><span class="lang-dot">AR</span><span>العربية</span><i>⌃</i></button>
    <div id="langMenu" class="lang-menu hidden"><button data-lang="ar">العربية</button><button data-lang="en">English</button></div>
  </div>
  <a class="float-pill support-pill" href="https://discord.gg/NzmA4xDnT" target="_blank" rel="noopener">🎧 <span id="supportText">الدعم</span></a>
</aside>

<div id="cartModal" class="cart-modal hidden">
  <div class="cart-backdrop" data-cart-close></div>
  <section class="cart-dialog">
    <header class="cart-header"><button class="cart-close" data-cart-close>×</button><div><h2 id="cartTitle">سلة التسوق</h2><small id="cartCountText">0 عنصر</small></div><span>🛍</span></header>
    <div class="cart-layout">
      <aside class="cart-summary-panel">
        <label id="couponLabel">كود الخصم</label>
        <div class="coupon-row"><input placeholder="كود الخصم"><button id="couponApply">تطبيق</button></div>
        <h3 id="summaryTitle">ملخص الطلب</h3>
        <div class="summary-box"><div><span id="subtotalLabel">المجموع الفرعي</span><b id="cartSubtotal">0 SAR</b></div><div class="total"><span id="totalLabel">المجموع الكلي</span><b id="cartTotal">0 SAR</b></div></div>
        <button id="checkoutButton" class="checkout-button">متابعة عملية الدفع</button>
      </aside>
      <div id="cartItems" class="cart-items"></div>
    </div>
  </section>
</div>

<script src="/store-config.js"></script><script src="/shop.js"></script>
</body></html>
